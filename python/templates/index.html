<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #37003c;
            --bs-primary-rgb: 55, 0, 60;
        }
        body {
            background-color: #ffffff;
        }
        .navbar {
            background-color: #37003c;
        }
        .navbar-brand {
            color: #ffffff !important;
            font-weight: 600;
        }
        .btn-primary {
            background-color: #37003c;
            border-color: #37003c;
        }
        .btn-primary:hover {
            background-color: #4d0054;
            border-color: #4d0054;
        }
        .rating-badge {
            background-color: #37003c;
            color: #ffffff;
            border-radius: 6px;
            padding: 2px 10px;
            font-weight: 600;
        }
        table th {
            color: #37003c;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">FPL Companion</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search a player...">
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Position</th>
                            <th>Rating</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('searchInput');
        const resultsBody = document.getElementById('resultsBody');
        let debounceTimer;

        input.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const query = input.value.trim();

            if (!query) {
                resultsBody.innerHTML = '';
                return;
            }

            debounceTimer = setTimeout(() => {
                fetch(`/api/search?q=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        resultsBody.innerHTML = '';
                        data.results.forEach(player => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${player.web_name}</td>
                                <td>${player.position}</td>
                                <td><span class="rating-badge">${player.rating ?? '-'}</span></td>
                            `;
                            resultsBody.appendChild(row);
                        });
                    });
            }, 250);
        });
    </script>

</body>
</html>
